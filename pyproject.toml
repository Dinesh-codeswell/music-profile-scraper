[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artist-import-studio"
version = "1.0.0"
description = "Artist Import Studio — Spotify & Apple Music scraper and EPK preview dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0,<1.0.0",
    "spotifyscraper>=3.0.0",
    "openpyxl>=3.1.2",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["frontend*", "public*", "tests*"]

[tool.vercel]
entrypoint = "backend.app:app"
