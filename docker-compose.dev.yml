services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: music-profile-scraper:dev
    container_name: music-profile-scraper-dev
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
      - ./public:/app/public:ro
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    command: ["python3", "-m", "uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
