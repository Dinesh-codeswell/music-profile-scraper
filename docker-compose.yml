services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: music-profile-scraper:latest
    container_name: music-profile-scraper
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys, os; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
